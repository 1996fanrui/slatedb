# Standalone crate: not part of the top-level SlateDB workspace.
[workspace]

[package]
name = "thread-model-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Isolates the cost of the cross-thread request/reply round-trip in SlateDB's write model
# (write_notifier.send + rx.await on a Tokio runtime), using a trivial +1 payload so the measured
# time is the round-trip itself, not the work. See README.md.

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "roundtrip"
harness = false
